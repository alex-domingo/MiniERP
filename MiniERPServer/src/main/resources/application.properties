#  =====================================================================
#   MINI ERP - Configuracion del servidor
#  =====================================================================
#   Los valores sensibles se leen de variables de entorno y solo usan el
#   valor por defecto que aparece tras ":" cuando la variable no existe.
#   Para produccion basta con definir DB_PASSWORD y JWT_SECRET en el
#   entorno, sin tocar este archivo.
#  =====================================================================

spring.application.name=MiniERP
server.port=${SERVER_PORT:8080}


# ---------------------------------------------------------------------
#  Base de datos PostgreSQL
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:minierp}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

#  Pool de conexiones
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=MiniErpPool


# ---------------------------------------------------------------------
#  JPA / Hibernate
# ---------------------------------------------------------------------
#  ddl-auto=validate es deliberado y NO debe cambiarse a update:
#  el esquema pertenece a las migraciones de Flyway. Hibernate solo
#  comprueba que las entidades concuerden con las tablas reales; si
#  alguien modifica una entidad sin escribir su migracion, la
#  aplicacion falla al arrancar en lugar de alterar la base en caliente.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

#  El dialecto NO se declara: Hibernate 7 lo detecta solo a partir de la
#  conexion y avisa (HHH90000025) si se fija a mano.
#  Tampoco se fija hibernate.jdbc.time_zone: las columnas son TIMESTAMP
#  sin zona horaria y las entidades usan LocalDateTime, de modo que no
#  hay ninguna conversion de zona de por medio. Es la combinacion mas
#  predecible para un sistema que opera en un solo pais.

#  open-in-view=false: cierra la sesion de persistencia al salir de la
#  capa de servicio. Evita consultas perezosas disparadas al serializar
#  la respuesta, que son una fuente clasica de N+1 y de conexiones
#  retenidas mas tiempo del necesario.
spring.jpa.open-in-view=false

spring.jpa.show-sql=${SHOW_SQL:false}


# ---------------------------------------------------------------------
#  Flyway : creacion y carga de la base de datos mediante scripts SQL
# ---------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

#  Limpieza deshabilitada: impide que un "flyway:clean" accidental
#  destruya la base de datos y con ella el historico de operaciones.
spring.flyway.clean-disabled=true


# ---------------------------------------------------------------------
#  Seguridad : JSON Web Token
# ---------------------------------------------------------------------
#  La clave debe tener al menos 32 bytes para HMAC-SHA256.
minierp.seguridad.jwt.secreto=${JWT_SECRET:c2VjcmV0by1taW5pZXJwLTIwMjYtY2FtYmlhci1lbi1wcm9kdWNjaW9uLXBvci1mYXZvcg==}
#  Vigencia del token en milisegundos (8 horas = una jornada laboral)
minierp.seguridad.jwt.expiracion=28800000
minierp.seguridad.jwt.emisor=MiniERP


# ---------------------------------------------------------------------
#  Reglas del negocio configurables
# ---------------------------------------------------------------------
#  Tasa de IVA vigente (Guatemala: 12%). Se guarda ademas en cada venta,
#  de modo que las facturas historicas conservan la tasa con la que
#  fueron emitidas aunque este valor cambie.
minierp.negocio.iva=0.12

#  Metodo de valuacion de inventario: UEPS (ultimas entradas, primeras
#  salidas). El motor de capas de costo lee este parametro para decidir
#  el orden en que consume las existencias.
minierp.negocio.metodo-valuacion=UEPS

#  Nombre que aparece en el encabezado de las facturas PDF
minierp.empresa.nombre=Mini ERP - Muebles para Hogar y Oficina
minierp.empresa.nit=1234567-8
minierp.empresa.direccion=Ciudad de Guatemala, Guatemala
minierp.empresa.telefono=2200-0000


# ---------------------------------------------------------------------
#  CORS : origenes autorizados del cliente Angular
# ---------------------------------------------------------------------
minierp.cors.origenes=${CORS_ORIGINS:http://localhost:4200}


# ---------------------------------------------------------------------
#  Serializacion JSON
#
#  Spring Boot 4 incorpora Jackson 3, que reorganizo sus paquetes
#  (com.fasterxml.jackson -> tools.jackson) y redistribuyo los features.
#
#  NO se declara "spring.jackson.serialization.write-dates-as-timestamps":
#  ese feature ya no pertenece a SerializationFeature (se movio a
#  tools.jackson.databind.cfg.DateTimeFeature, bajo el prefijo
#  spring.jackson.datatype.datetime) y, sobre todo, ya no hace falta:
#  Jackson 3 serializa fechas como texto ISO-8601 por defecto, que es
#  exactamente el formato que el cliente Angular espera recibir.
# ---------------------------------------------------------------------
spring.jackson.time-zone=America/Guatemala
spring.jackson.default-property-inclusion=non_null


# ---------------------------------------------------------------------
#  Manejo de errores
#  Se ocultan los detalles internos: la API responde con el formato de
#  error propio definido en el manejador global de excepciones.
# ---------------------------------------------------------------------
server.error.include-stacktrace=never
server.error.include-message=never
spring.mvc.problemdetails.enabled=true


# ---------------------------------------------------------------------
#  Bitacora de la aplicacion
# ---------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.minierp=${LOG_LEVEL:INFO}
logging.level.org.flywaydb=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
